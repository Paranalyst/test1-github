name: Weekly open-items alert (GitHub Issue)

on:
  schedule:
    - cron: "40 1 * * 1"      # ทุกวันจันทร์ 08:40 น. เวลาไทย
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build open items
        run: python scripts/openitems.py
      - name: Open this week's issue (close last week's)
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          WEEK=$(TZ=Asia/Bangkok date +%G-W%V)
          TITLE="🔔 บัญชีค้าง ${WEEK}"
          set +e; python scripts/weekly_alert.py > body.md; rc=$?; set -e
          if [ "$rc" = "3" ]; then echo "ไม่มีรายการต้องเตือน — ไม่เปิด issue"; exit 0; fi
          [ "$rc" = "0" ] || exit "$rc"
          gh label create open-items --color FBCA04 --description "แจ้งเตือนบัญชีค้าง" 2>/dev/null || true
          for n in $(gh issue list --label open-items --state open --json number,title --jq ".[] | select(.title != \"$TITLE\") | .number"); do
            gh issue close "$n" --comment "ปิดอัตโนมัติ — ดูสัปดาห์ ${WEEK}"
          done
          existing=$(gh issue list --label open-items --state open --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
          else
            gh issue create --title "$TITLE" --label open-items --body-file body.md
          fi
